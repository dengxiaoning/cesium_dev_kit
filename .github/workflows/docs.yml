name: Docs

# 生成 API 文档并发布到 GitHub Pages：
# https://dengxiaoning.github.io/cesium_dev_kit/
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'typedoc.json'
      - 'typedoc.en.json'
      - 'typedoc.entry.md'
      - 'typedoc.entry.en.md'
      - 'tsconfig.docs.json'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build API docs (TypeDoc + JSDoc, 中文)
        run: npm run docs:typedoc

      - name: Build API docs (English UI)
        run: npm run docs:typedoc:en

      # Demo 站点发布到同一个 Pages 站点下的 /demo/，文档页顶部的「在线 Demo」就指向它。
      # 必须放在 docs 之后：typedoc 会先清空 docs/，再往里写 demo 才能保留下来。
      - name: Build demo site into docs/demo
        run: npm run build:demo:pages

      # 历史版本快照：docs-archive 分支按 vX.Y.Z/ 存着各版本的文档产物。
      # 必须放在 typedoc 之后（cleanOutputDir 会清空 docs/），
      # 且在 docs:extras 之前（writeVersions 靠扫描 docs/v*/ 生成 versions.json）。
      # 分支还不存在时不算失败，退化为「只有最新版」。
      - name: Checkout docs-archive branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: docs-archive
          path: .archive
          fetch-depth: 1

      - name: Merge archived versions into docs
        run: |
          if [ ! -d .archive ]; then
            echo "::notice::docs-archive 分支不存在，本次只发布最新版"
            exit 0
          fi
          shopt -s nullglob
          for dir in .archive/v*/; do
            name=$(basename "$dir")
            if [ -e "docs/$name" ]; then
              echo "skip $name (already exists)"
              continue
            fi
            cp -r "$dir" "docs/$name"
            echo "archived version: $name"
          done
          ls -1 docs | grep '^v' || echo "（尚无归档版本）"

      # 最后生成示例静态页 / sitemap / robots / llms.txt / api-index.json / versions.json，
      # 此时 docs/ 与 docs/en/ 都已就绪，sitemap 才能把中英文页面一起收进去。
      - name: Build site extras (examples / sitemap / llms / versions)
        run: npm run docs:extras

      # 中英文一致性闸门：覆盖率 < 90%、英文站出现中文、或缺类页/成员数不一致都会让构建失败，
      # 避免「某次提交把中文说明带进英文站」这种问题静默上线。
      - name: Verify bilingual docs
        run: npm run docs:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
