name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # lockfile 已纳入版本管理，用 npm ci 严格按 lockfile 安装，避免 CI 版本漂移
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build library (ESM/CJS/types)
        run: npm run build:lib

      - name: Check package exports
        run: npm run check:exports

      # publint：校验 exports/main/types 是否符合 Node 解析规则
      - name: Lint package (publint)
        run: npm run check:publint

      # attw：校验 ESM/CJS 下的类型声明是否都能正确解析
      - name: Check type resolution (attw)
        run: npm run check:types

      - name: Build demo
        run: npm run build

      # 文档构建失败不阻塞示例，但要在 PR 阶段暴露出来
      - name: Build API docs
        run: npm run docs
