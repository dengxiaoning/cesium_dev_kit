name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write 是给下面的 GitHub Release 步骤用的（创建/更新 release）
      contents: write
      # actions: write 用于发布后重新触发 Docs 工作流，让新归档的版本立刻出现在站点上
      actions: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # 用 24.x：Node 24 自带 npm 11.5+，既能满足 --provenance，
      # 也让下面的 npm Trusted Publishing（OIDC）方案可直接启用
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 发布前的两条硬校验，防止「tag 打了、版本号没跟上」和「发了版但没有变更记录」。
      # 历史上有 91 个版本里只有 4 个在 CHANGELOG 留了记录，导致使用者无法判断版本差异。
      - name: Verify tag, version and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $version 不一致，先跑 npm run release:version 再打 tag"
            exit 1
          fi
          node scripts/release-notes.mjs
          if [ ! -s .release-notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 $version 的小节，先跑 npm run release:version"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build library
        run: npm run build:lib

      - name: Check package exports
        run: npm run check:exports

      - name: Lint package (publint)
        run: npm run check:publint

      - name: Check type resolution (attw)
        run: npm run check:types

      # 发布凭据二选一：
      # A. 仓库 Secrets 里的 NPM_TOKEN 必须是「能绕过 2FA」的 token，否则会报
      #    EOTP "This operation requires a one-time password from your authenticator"。
      #    - Classic Token -> 类型选 Automation
      #    - 或 Granular Token 勾选 "Bypass two-factor authentication (2FA)"
      # B. 或改用 npm Trusted Publishing（OIDC，无需 token）：npmjs 包页 Settings ->
      #    Trusted Publisher -> GitHub Actions 填 dengxiaoning/cesium_dev_kit、release.yml，
      #    然后删掉下面的 NODE_AUTH_TOKEN（需要 npm >= 11.5，即 Node 24 runner）。
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "cesium_dev_kit@$version" version >/dev/null 2>&1; then
            echo "cesium_dev_kit@$version 已发布，跳过（方便 tag 重跑时补建 Release）"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm 发布成功后，同步建一条 GitHub Release。
      # 版本页是外部判断「这个项目还在维护吗」的第一入口，之前一直停在 v1.1.19。
      # 正文取自上面校验步骤生成的 .release-notes.md（来自 CHANGELOG.md 的对应小节）。
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ -s .release-notes.md ]; then
            notes=(--notes-file .release-notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${notes[@]}"
          else
            gh release create "$tag" --title "$tag" "${notes[@]}"
          fi

      # ---------------------------------------------------------------------
      # 文档归档：每个 tag 版本在 docs-archive 分支下留一份 vX.Y.Z/ 快照。
      # 主站 docs.yml 会 checkout 这个分支并把 v*/ 合进 docs/，
      # 于是版本切换器（docs/assets/custom.js -> versions.json）就能列出版本历史。
      # ---------------------------------------------------------------------
      - name: Build docs snapshot for archive
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run docs:typedoc && npm run docs:typedoc:en

      - name: Push docs snapshot to docs-archive branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" docs-archive >/dev/null 2>&1; then
            git clone --depth 1 --branch docs-archive "$remote" "$work/archive"
          else
            mkdir -p "$work/archive"
            git -C "$work/archive" init -q
            git -C "$work/archive" checkout -q -b docs-archive
          fi
          target="$work/archive/v${version}"
          rm -rf "$target"
          mkdir -p "$target"
          # demo 体积大且始终指向最新站点，不进归档
          ( cd docs && tar --exclude='./demo' -cf - . ) | ( cd "$target" && tar -xf - )
          git -C "$work/archive" config user.name "github-actions[bot]"
          git -C "$work/archive" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work/archive" add -A
          if git -C "$work/archive" diff --cached --quiet; then
            echo "v${version} 已归档，跳过"
          else
            git -C "$work/archive" commit -m "docs: archive v${version}"
            git -C "$work/archive" push origin HEAD:docs-archive
          fi

      - name: Refresh Pages with the new archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main || echo "::notice::请手动触发 Docs 工作流"
